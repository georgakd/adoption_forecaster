
[tool.poetry]
name = "quotas-forecasting"
version = "0.1.0"
description = "Quotas forecasting system for education and age/gender predictions"
authors = ["Dimitra Georgakaki <dgeorgakaki@gwi.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.11"

# Core data & modeling libraries
numpy = "^2.2.0"
pandas = "^2.2.3"
scikit-learn = "^1.6.1"
scipy = "^1.15.3"
statsmodels = "^0.14.0"
sktime = "^0.37.1"
pyjstat = "^2.4.0"

# GCP integration
google-cloud-storage = "^3.2.0"
google-cloud-pubsub="^2.18.4"
google-cloud-secret-manager = "^2.24.0"
gcsfs = "^2025.5.1"

# Other utilities
pyyaml = "^6.0.2"
requests = "^2.32.4"
protobuf = "^4.25.1"
python-docx = "^1.1.0"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"  # Only needed during development

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Code formatting and linting configuration
[tool.black]
line-length = 149

[tool.ruff]
line-length = 149
