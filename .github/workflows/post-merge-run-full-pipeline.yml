name: Post-Merge Full QuFo Pipeline Run

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

jobs:
  forecast-and-push-image:
    runs-on: ${{ fromJSON(vars.GWI_DEFAULT_RUNNERS) }}
    timeout-minutes: 60
    container:
      image: eu.gcr.io/gwi-host-net/ubuntu:act-latest
      credentials:
        username: _json_key
        password: ${{ secrets.SA_GWI_HOST_NET }}
    name: 🚀 Run forecasting pipeline (both modules) - 📦 Push Docker image to GCR - test forecast

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: ☁️ Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.SA_GWI_HOST_NET }}

      - name: 🐳 Build Docker image
        run: |
          docker build -t quotas-forecasting-image .

      - name: 🔐 Fetch forecasting SA key from Secret Manager
        run: |
          gcloud secrets versions access latest \
                      --project=339766178133 \
                      --secret="quotas-forecasting-sa-key" \
                      > forecasting-creds.json

      - name: 🧪 Run forecasting for both modules
        run: |
          docker run --rm \
            -v /home/runner/_work/quotas_forecasting/quotas_forecasting/forecasting-creds.json:/tmp/credentials.json \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/credentials.json \
            quotas-forecasting-image \
            --module both --mode prod --pred-year 2026 --last-year 2024

      - name: 🔐 Docker login to GCR
        uses: docker/login-action@v2
        with:
          registry: eu.gcr.io
          username: _json_key
          password: ${{ secrets.SA_GWI_HOST_NET }}

      - name: 📦 Push image to GCR
        run: |
          docker tag quotas-forecasting-image eu.gcr.io/ml-cloud-374512/quotas-forecasting-image:latest
          docker push eu.gcr.io/ml-cloud-374512/quotas-forecasting-image:latest
